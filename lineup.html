<!doctype html>
<html><head><meta charset="utf-8"><title>Lineup</title>
<style>body{margin:0;background:#2a3346}canvas{display:block}</style></head>
<body>
<script src="js/vendor/three.min.js"></script>
<script src="js/sd.js"></script>
<script src="js/data.js"></script>
<script>
// dev page: every runner at its in-game height on one line (grid line every 0.5 units)
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const Q = new URLSearchParams(location.search), PG = +(Q.get('page') || 0);
const LIST = DATA.CHARS.slice(PG * 10, PG * 10 + 10);
const n = 10, VW = n * 2.4, VH = VW * innerHeight / innerWidth;
const camera = new THREE.OrthographicCamera(0, VW, 4, -0.5, -100, 100);
const lines = [];
for (let y = 0; y <= 4; y += 0.5) lines.push(new THREE.Vector3(0, y, 0), new THREE.Vector3(VW, y, 0));
scene.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(lines), new THREE.LineBasicMaterial({ color: 0x55607a })));
const chars = [];
LIST.forEach(async (d, i) => {
  const t = await SD.prepare(d.id);
  const c = SD.create(d.id);
  const k = d.h / t.height;
  c.root.scale.set(k, k, 1);
  c.root.position.set(1.2 + i * 2.4 - (t.box.min.x + t.box.max.x) / 2 * k, -t.box.min.y * k, 0);
  c.play(Q.get('clip') || 'move', null, true);
  scene.add(c.root);
  chars.push(c);
});
let last = 0;
(function loop(t) { requestAnimationFrame(loop); const dt = Math.min(0.05, (t - last) / 1000 || 0); last = t; chars.forEach((c) => c.update(dt)); renderer.render(scene, camera); })();
</script></body></html>
